<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="temp-conv">
        <h2>Temperature Conversion:</h2><br>
        <input type="number" name="value" id="value"><br>

        <input type="radio" name="temp" id="rd1">
        <label for="rd1">Celsius → Fahrenheit</label><br>

        <input type="radio" name="temp" id="rd2">
        <label for="rd2">Fahrenheit → Celsius</label><br>

        <button id="submit">Submit</button>

        <p id="res">
            <!-- the result is -->
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
