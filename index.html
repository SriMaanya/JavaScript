<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  
  <main class="main-section">
    <div class="hero-section">
      <p>GITHUB PROFILE LOOKUP</p>
      <h1>User viewer</h1>
      <p>Search a GitHub username to view its public profile information</p>
    </div>

    <div class="user-input-container">
      <p>GitHub username</p>
      <div class="user-input">
        <input type="text" name="input" placeholder="e.g. octocat" class="input">
        <button class="submit">Search</button>
      </div>
    </div>

    <div class="users-information">
      <img src='https://avatars.githubusercontent.com/u/9919?s=280&v=4'
          alt="not found" >
      
      <div class="users-details">
        <div class="github-user">
          <p class="heading-start">GITHUB USER</p>
          <h2 class="username">Search for a profile</h2>
          <p class="heading-last">Enter a user above to get started</p>
          <div class="conatiner">
            <div>
              <p>Login Name</p>
              <span class="loginName"></span>
            </div>
            <div>
              <p>User Id</p>
              <span class="userId"></span>
            </div>
            <div>
              <p>Avatar URL</p>
              <span class="avatarURL"></span>
            </div>
            <div>
              <p>User View</p>
              <span class="UserView"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
